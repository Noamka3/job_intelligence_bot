services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: job_bot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: job_bot
      POSTGRES_PASSWORD: job_bot
      POSTGRES_DB: job_bot
    ports:
      # Bound to 127.0.0.1, not every interface: Docker's default
      # publishes a port to the whole network (and punches through the
      # host firewall), which would put a database whose password is
      # "job_bot" on the LAN. Only this machine needs it - the worker and
      # beat reach Postgres over the compose network instead.
      # Host port 5544 (not 5432): this machine already has a native
      # Windows Postgres service and another project's Postgres container
      # bound to 5432/5433. Avoids colliding with either.
      - "127.0.0.1:5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_bot -d job_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: job_bot_redis
    restart: unless-stopped
    ports:
      # 127.0.0.1 for the same reason as Postgres above - Redis has no
      # password at all, so it must never be reachable off this machine.
      # Host port 6380 (not 6379): another project's Redis container
      # already holds 6379 on this machine.
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Phase 6: the scheduler + the process that actually crawls/scores.
  # Both use the app's own image (see Dockerfile) and talk to
  # postgres/redis over the internal Docker network - note the URLs here
  # use the service names and *container* ports (5432/6379), not the
  # host-mapped ports (5544/6380) .env/the Windows-side API use.
  worker:
    build: .
    container_name: job_bot_worker
    restart: unless-stopped
    # concurrency=2: each prefork worker process loads its own independent
    # copy of the local embedding model (~hundreds of MB, see
    # app/services/embeddings - it's process-local via @lru_cache, so
    # forking doesn't share it). The default (one process per CPU core)
    # was verified live against all 210 real due sources and caused the
    # WSL2 VM (3.75GB total) to run out of memory and SIGKILL workers
    # mid-crawl once enough sources became due at the same time - a
    # thundering herd that a busy Beat cycle or a fresh sheet sync could
    # reproduce. 2 keeps peak concurrent model copies bounded and safe.
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg://job_bot:job_bot@postgres:5432/job_bot
      REDIS_URL: redis://redis:6379/0
      EMBEDDING_PROVIDER: local
      # From the project's .env: the crawler asks Jev about new postings
      # only when a key is set (docs/jev.md); empty means off.
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-jev-1.13.0}
      JEV_WEIGHT: ${JEV_WEIGHT:-0}
    volumes:
      # Must match FASTEMBED_CACHE_PATH in the Dockerfile - fastembed
      # caches under <system temp>/fastembed_cache by default, not
      # ~/.cache, so a mount anywhere else silently re-downloads the
      # ~240MB model on every container recreate.
      - fastembed_cache:/home/app/.cache/fastembed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    container_name: job_bot_beat
    restart: unless-stopped
    # A worker with Beat embedded (--beat) that consumes only the
    # "scheduler" queue, i.e. it runs dispatch_due_sources itself the
    # moment Beat fires it. On the shared queue the dispatcher waited
    # behind every crawl queued before it - after a pause that's hundreds
    # - so the status page's countdown ran late for an hour. The
    # dispatcher never embeds anything, so this container stays small
    # (--pool=solo: one thread, no forked model copies).
    # --schedule: beat persists its state file next to wherever it runs
    # (/app, root-owned in the image) unless told otherwise; the image
    # runs as a non-root user.
    command: celery -A app.tasks.celery_app worker --beat --queues=scheduler --pool=solo --concurrency=1 --loglevel=info --schedule=/home/app/celerybeat-schedule
    environment:
      DATABASE_URL: postgresql+psycopg://job_bot:job_bot@postgres:5432/job_bot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  fastembed_cache:
