[project]
name = "job-intel-bot"
version = "0.1.0"
description = "Personal job intelligence bot: monitors company career pages, matches jobs against a CV and target roles, and notifies via WhatsApp."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "openai>=1.55",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "typer>=0.13",
    "python-multipart>=0.0.17",
    "httpx>=0.27",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "tenacity>=9.0",
    "truststore>=0.9",
    "fastembed>=0.4",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "respx>=0.21",
    "types-openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Machine-generated by `alembic revision --autogenerate`; not hand-styled.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI system relies on calling Depends()/Query()/... as an
# argument default - that's the intended pattern, not the mutable-default
# bug B008 otherwise catches.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

[[tool.mypy.overrides]]
# google-api-python-client's Resource objects are built dynamically at
# runtime and ship no type stubs.
module = ["googleapiclient.*", "google.oauth2.*", "google_auth_httplib2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# onnxruntime's C-extension internals ship no stubs/py.typed marker.
module = "onnxruntime.capi.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
